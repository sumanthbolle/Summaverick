# XcodeGen spec for the Summaverick Everyday iOS app.
#   brew install xcodegen
#   ./get-llama-xcframework.sh      # downloads Frameworks/llama.xcframework
#   xcodegen generate               # creates SummaverickEveryday.xcodeproj
#   open SummaverickEveryday.xcodeproj
name: SummaverickEveryday
options:
  bundleIdPrefix: com.summaverick
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: false
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""        # set your Apple Team ID here or in Xcode > Signing

targets:
  SummaverickEveryday:
    type: application
    platform: iOS
    sources:
      - path: SummaverickEveryday
      # The portable core is compiled straight into the app target. Same files as the device build.
      # Only src/ is listed; core/include is found via HEADER_SEARCH_PATHS and does not need to be in the project.
      - path: ../core/src
        name: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.summaverick.everyday
        SWIFT_OBJC_BRIDGING_HEADER: SummaverickEveryday/Bridging.h
        CODE_SIGN_ENTITLEMENTS: SummaverickEveryday/SummaverickEveryday.entitlements
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../core/include"
          - "$(SRCROOT)/../core/src"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "GGML_USE_METAL=1"
        OTHER_LDFLAGS:
          - "-lsqlite3"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO   # llama.xcframework headers use "ggml.h" style includes
    info:
      path: SummaverickEveryday/Info.plist
      properties:
        CFBundleDisplayName: Summaverick
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "Summaverick records lectures, meetings and notes only when you press Record. Audio never leaves this device."
        NSSpeechRecognitionUsageDescription: "Speech is converted to text on this device using Apple's on-device recogniser. Nothing is sent to a server."
        NSFaceIDUsageDescription: "Unlock your notes."
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: false
    dependencies:
      - framework: Frameworks/llama.xcframework
        embed: true
      - sdk: libsqlite3.tbd
      - sdk: Speech.framework
      - sdk: AVFoundation.framework
      - sdk: LocalAuthentication.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: Accelerate.framework
