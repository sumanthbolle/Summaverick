<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Search — summaverick</title>
    <meta name="description" content="Search essays and interviews." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/assets/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/site.webmanifest" />
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header id="site-header"></header>
    <main id="main" class="page narrow">
      <h1>Search</h1>
      <form id="form" class="ask" role="search">
        <label class="lbl" style="flex: 1 1 280px">
          Query
          <input id="q" class="field" type="search" name="q" minlength="2" required placeholder="GlideAjax, Fluent, CMDB…" />
        </label>
        <button class="btn primary" type="submit">Search</button>
      </form>
      <div id="error" class="error" hidden></div>
      <div id="results" class="grid" style="margin-top: 20px"></div>
    </main>
    <nav id="tabbar"></nav>
    <footer id="site-footer"></footer>
    <script src="/assets/search.js" type="module"></script>
  </body>
</html>
