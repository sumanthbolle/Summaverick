<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Quiz — summaverick</title>
    <meta
      name="description"
      content="ServiceNow quizzes — CSA, Scripting, Architecture, Modules, CSM, GRC, CIS-Discovery. Answers are graded server-side and never shipped to the browser."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/assets/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/site.webmanifest" />
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header id="site-header"></header>
    <main class="page" id="main">
      <section id="view-categories" hidden>
        <p class="eyebrow">Practice</p>
        <h1>ServiceNow quiz</h1>
        <p class="tag">Pick a category, then a mode. Answers are graded on the server — nothing is scrapeable from this page.</p>
        <p><a class="btn ghost" href="#" id="historyLink">Your attempts</a></p>
        <div id="categoryGrid" class="grid auto"></div>
      </section>

      <section id="view-modes" hidden>
        <button class="btn ghost back" data-go="categories" type="button">Categories</button>
        <h2 id="modeCatName"></h2>
        <div id="modeList" class="modes"></div>
      </section>

      <section id="view-quiz" hidden>
        <div class="quiz-head">
          <span id="progress" class="progress"></span>
          <span id="timer" class="timer"></span>
        </div>
        <div id="questionCard" class="card"></div>
        <div class="actions">
          <button id="submitBtn" class="btn primary" disabled>Submit</button>
          <button id="nextBtn" class="btn primary" hidden>Next</button>
          <button id="finishBtn" class="btn ghost" hidden>Finish</button>
        </div>
        <div id="feedback" class="feedback" hidden></div>
      </section>

      <section id="view-results" hidden>
        <h2>Results</h2>
        <div id="scoreBox" class="scorebox"></div>
        <div id="reviewList" class="review"></div>
        <button class="btn primary" data-go="categories" type="button">New quiz</button>
      </section>

      <section id="view-history" hidden>
        <button class="btn ghost back" data-go="categories" type="button">Back</button>
        <h2>Your attempts</h2>
        <div id="historyList" class="review"></div>
      </section>

      <div id="loading" class="loading">Loading…</div>
      <div id="error" class="error" hidden></div>
    </main>
    <nav id="tabbar"></nav>
    <footer id="site-footer"></footer>
    <script src="/assets/quiz.js" type="module"></script>
  </body>
</html>
