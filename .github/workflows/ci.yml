name: ci

# Self-contained: everything this workflow needs lives in the repo. No
# Cloudflare account, API token, or provisioned D1/KV/R2 is required. The
# build is validated with `wrangler deploy --dry-run`, which compiles the
# Worker and checks the bindings config without authenticating.
#
# Deploying to Cloudflare is deliberately kept out of the push/PR path — see
# deploy.yml (manual only) and docs/decisions.md.

# Build/test on pull requests (and on demand). Pushes to master are covered by
# deploy.yml, which runs the same typecheck + tests before deploying, so this
# does not also run there — avoids duplicate runs on the same commit.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Do not set `version` here. package.json already pins
      # "packageManager"; setting both makes pnpm/action-setup fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      # Compiles the Worker and validates wrangler.jsonc bindings without any
      # Cloudflare credentials. Fails the build if the Worker cannot be built.
      - name: Build (dry run)
        run: pnpm exec wrangler deploy --dry-run --outdir=.wrangler/dist
