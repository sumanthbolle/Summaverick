name: deploy

# Cloudflare Workers Builds (the Git integration on the summaverick Worker)
# deploys every push to master. This workflow does the parts it does not:
#
#   push to master     typecheck + tests, remote D1 migrations, and copying
#                      PERPLEXITY_API_KEY onto the Worker when the token may
#                      write to it. It never runs `wrangler deploy`, so the two
#                      deployers cannot race.
#   manual dispatch    all of the above plus `wrangler deploy` and post-deploy
#                      checks — for redeploying without Workers Builds.
#
# Repo secrets (Settings → Secrets and variables → Actions, or Settings →
# Environments → production):
#   - CLOUDFLARE_API_TOKEN   Account → D1 → Edit for migrations. Writing to the
#                            Worker also needs Account → Workers Scripts → Edit
#                            and Zone → Workers Routes → Edit (summaverick.com).
#   - CLOUDFLARE_ACCOUNT_ID  the Account ID from Workers overview, NOT a Zone ID
#   - PERPLEXITY_API_KEY     copied to the summaverick Worker
# The preflight step names any missing permission. See docs/decisions.md.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHub Environment secrets are unavailable unless the job selects it.
    # Repository-level secrets remain available as well.
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      # Job-level so step conditions can read it.
      # GitHub masks it in logs; no step prints it.
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      MANUAL_DEPLOY: ${{ github.event_name == 'workflow_dispatch' }}
      CI: true
    steps:
      - uses: actions/checkout@v4

      - name: Check required Perplexity secret
        if: env.PERPLEXITY_API_KEY == '' && env.MANUAL_DEPLOY == 'true'
        run: |
          echo "::error::PERPLEXITY_API_KEY is missing. Add it in this repository under Settings → Environments → production → Environment secrets, or Settings → Secrets and variables → Actions. Re-run deploy after saving it."
          exit 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      # Names the missing permission instead of a generic wrangler error. Missing
      # Worker access only fails the manual deploy; on push it is a warning.
      - name: Check Cloudflare credentials
        id: preflight
        run: node scripts/check-cloudflare-auth.mjs ${{ env.MANUAL_DEPLOY == 'true' && '--require-worker' || '' }}

      - name: Apply D1 migrations (remote)
        if: steps.preflight.outputs.d1_ok == 'true'
        run: pnpm exec wrangler d1 migrations apply summaverick --remote

      - name: Deploy Worker
        if: env.MANUAL_DEPLOY == 'true'
        run: pnpm exec wrangler deploy

      # GitHub secrets are not automatically Worker bindings. Copy the value
      # through stdin without logging it. This updates the active Worker
      # version; later deploys (including Workers Builds) retain it.
      - name: Set PERPLEXITY_API_KEY on the Worker
        if: steps.preflight.outputs.worker_access == 'true' && env.PERPLEXITY_API_KEY != ''
        run: printf '%s' "$PERPLEXITY_API_KEY" | pnpm exec wrangler secret put PERPLEXITY_API_KEY

      - name: Perplexity key not synced
        if: steps.preflight.outputs.worker_access != 'true'
        run: |
          echo "::warning::PERPLEXITY_API_KEY was not copied to the summaverick Worker because the Cloudflare token cannot write to it (see the preflight warning). /ask-summaverick keeps answering through ASK_FALLBACK_URL. Either grant the token Workers Scripts → Edit, or add the secret in the Cloudflare dashboard → Workers & Pages → summaverick → Settings → Variables and Secrets."

      - name: Verify Perplexity connection through the deployed assistant
        if: env.MANUAL_DEPLOY == 'true'
        run: node scripts/verify-perplexity.mjs https://summaverick.com

      - name: Smoke checks (Worker + pages)
        if: env.MANUAL_DEPLOY == 'true'
        run: node scripts/verify.mjs --core https://summaverick.com

      - name: Smoke checks (D1 catalog)
        if: env.MANUAL_DEPLOY == 'true' && steps.preflight.outputs.d1_ok == 'true'
        continue-on-error: true
        run: node scripts/verify.mjs https://summaverick.com
