name: deploy

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Do not set `version` here. package.json already pins
      # "packageManager": "pnpm@10.33.0"; setting both makes pnpm/action-setup
      # fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Wrangler CI auth: token is required; account id is required unless
      # wrangler.jsonc has account_id. Read secrets first, then Actions vars
      # (in case the values were added under Variables instead of Secrets).
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check Cloudflare credentials
        run: |
          missing=0
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set."
            echo "::error::GitHub → Settings → Secrets and variables → Actions → Secrets"
            echo "::error::Create a token at https://dash.cloudflare.com/profile/api-tokens"
            echo "::error::Template: Edit Cloudflare Workers. Also enable D1 Edit, Workers KV Storage Edit, Workers R2 Storage Edit."
            missing=1
          else
            echo "CLOUDFLARE_API_TOKEN is present (${#CLOUDFLARE_API_TOKEN} chars)"
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::warning::CLOUDFLARE_ACCOUNT_ID is not set. If wrangler errors with 'No account id found', add it as an Actions variable from the Cloudflare dashboard Workers overview."
          else
            echo "CLOUDFLARE_ACCOUNT_ID is present (${#CLOUDFLARE_ACCOUNT_ID} chars)"
          fi
          exit "$missing"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations (remote)
        run: pnpm exec wrangler d1 migrations apply summaverick --remote

      - name: Deploy Worker
        run: pnpm exec wrangler deploy

      - name: Smoke checks
        run: node scripts/verify.ts https://summaverick.com
