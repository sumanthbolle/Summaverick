name: deploy

# Deploys the Worker to Cloudflare on every push to master, and on demand from
# the Actions tab. Requires these repo secrets (Settings → Secrets and
# variables → Actions, or Settings → Environments → production):
#   - CLOUDFLARE_API_TOKEN   (Workers + D1 + KV + R2 Edit)
#   - CLOUDFLARE_ACCOUNT_ID  (the Account ID from Workers overview, NOT a Zone ID)
#   - PERPLEXITY_API_KEY     (required — copied to the summaverick Worker)
# and wrangler.jsonc must point at real D1/KV/R2 resources with summaverick.com
# added to that Cloudflare account. Until the secrets are set, the deploy job
# fails fast at the credential check; the separate ci.yml build/test stays
# green regardless. See docs/decisions.md.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHub Environment secrets are unavailable unless the job selects it.
    # Repository-level secrets remain available as well.
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      # Job-level so the required-secret check can read it.
      # GitHub masks it in logs; the step below never prints it.
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      CI: true
    steps:
      - uses: actions/checkout@v4

      - name: Check required Perplexity secret
        if: env.PERPLEXITY_API_KEY == ''
        run: |
          echo "::error::PERPLEXITY_API_KEY is missing. Add it in this repository under Settings → Environments → production → Environment secrets, or Settings → Secrets and variables → Actions. Re-run deploy after saving it."
          exit 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      # Explains a D1-only 7403 (token missing Account -> D1 -> Edit, or a Zone
      # ID pasted as Account ID) instead of a generic wrangler error.
      - name: Check Cloudflare credentials
        run: node scripts/check-cloudflare-auth.mjs

      # The "Edit Cloudflare Workers" token template does not include D1, so
      # this often fails with Cloudflare 7403. Do not block the deploy on it;
      # static pages and non-D1 routes do not need it.
      - name: Apply D1 migrations (remote)
        id: d1
        continue-on-error: true
        run: pnpm exec wrangler d1 migrations apply summaverick --remote

      - name: Deploy Worker
        run: pnpm exec wrangler deploy

      # GitHub secrets are not automatically Worker bindings. Copy the value
      # AFTER deploy (the Worker must exist first), through stdin without logging
      # it. This updates the active Worker version; later deploys retain it.
      - name: Set PERPLEXITY_API_KEY on the Worker
        run: printf '%s' "$PERPLEXITY_API_KEY" | pnpm exec wrangler secret put PERPLEXITY_API_KEY

      - name: Verify Perplexity connection through the deployed assistant
        run: node scripts/verify-perplexity.mjs https://summaverick.com

      - name: Smoke checks (Worker + pages)
        run: node scripts/verify.mjs --core https://summaverick.com

      - name: Smoke checks (D1 catalog)
        if: steps.d1.outcome == 'success'
        continue-on-error: true
        run: node scripts/verify.mjs https://summaverick.com

      - name: D1 migrations note
        if: steps.d1.outcome == 'failure'
        run: |
          echo "::warning::Remote D1 migrations failed (often Cloudflare 7403: API token missing Account -> D1 -> Edit). The Worker was still deployed. Edit the token at https://dash.cloudflare.com/profile/api-tokens, add D1 Edit, then re-run this workflow."
